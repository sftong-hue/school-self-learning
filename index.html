<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 課後黑板大冒險 ｜ S1-S6 全科自學修煉館</title>
  
  <!-- Google Fonts: 手繪粉筆風格字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet">
  
  <!-- SheetJS CDN (支援 Excel 智慧多工作表匯入) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Google Firebase 即時資料庫 SDK (Compat 版本，保證最優瀏覽器相容性) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --board-bg: #1e2d24;
      --board-frame: #4a2e18;
      --board-inner-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7);
      --chalk-white: #f5f5f0;
      --chalk-yellow: #fef08a;
      --chalk-green: #86efac;
      --chalk-blue: #93c5fd;
      --chalk-pink: #f472b6;
      --chalk-orange: #fdba74;
      --chalk-purple: #d8b4fe;
      --chalk-gray: rgba(245, 245, 240, 0.4);
      --dust-overlay: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 80%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #121915;
      color: var(--chalk-white);
      font-family: 'Patrick Hand', 'Microsoft JhengHei', 'PingFang TC', cursive, sans-serif;
      min-height: 100vh;
      padding: 15px;
      line-height: 1.6;
    }

    .blackboard-frame {
      background-color: var(--board-frame);
      border: 12px solid #38200e;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.6);
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .blackboard {
      background: var(--board-bg) var(--dust-overlay);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0),
        linear-gradient(to bottom, #1a261f, #223329);
      background-size: 24px 24px, 100% 100%;
      border-radius: 8px;
      box-shadow: var(--board-inner-shadow);
      border: 2px dashed rgba(245, 245, 240, 0.25);
      padding: 22px 28px;
      position: relative;
    }

    header {
      border-bottom: 2px dashed var(--chalk-gray);
      padding-bottom: 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .title-area h1 {
      font-size: 2.3rem;
      color: var(--chalk-yellow);
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-area p {
      color: var(--chalk-white);
      font-size: 1.05rem;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sync-status-badge {
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sync-online { background: rgba(134, 239, 172, 0.2); border: 1px solid var(--chalk-green); color: var(--chalk-green); }
    .sync-local { background: rgba(254, 240, 138, 0.2); border: 1px solid var(--chalk-yellow); color: var(--chalk-yellow); }

    .user-badge-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px dashed var(--chalk-white);
      flex-wrap: wrap;
    }
    .role-tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .role-admin { background: #b91c1c; color: #fff; }
    .role-teacher { background: #d97706; color: #fff; }
    .role-student { background: #047857; color: #fff; }

    .btn {
      background: transparent;
      border: 2px solid var(--chalk-white);
      color: var(--chalk-white);
      padding: 6px 14px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
    .btn-yellow { border-color: var(--chalk-yellow); color: var(--chalk-yellow); }
    .btn-yellow:hover { background: rgba(254, 240, 138, 0.15); }
    .btn-green { border-color: var(--chalk-green); color: var(--chalk-green); }
    .btn-green:hover { background: rgba(134, 239, 172, 0.15); }
    .btn-pink { border-color: var(--chalk-pink); color: var(--chalk-pink); }
    .btn-pink:hover { background: rgba(244, 114, 182, 0.15); }
    .btn-blue { border-color: var(--chalk-blue); color: var(--chalk-blue); }
    .btn-blue:hover { background: rgba(147, 197, 253, 0.15); }
    .btn-purple { border-color: var(--chalk-purple); color: var(--chalk-purple); }
    .btn-purple:hover { background: rgba(216, 180, 254, 0.15); }
    .btn-sm { padding: 3px 8px; font-size: 0.88rem; }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--chalk-gray);
      color: var(--chalk-white);
      padding: 8px 18px;
      font-size: 1.1rem;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(254, 240, 138, 0.2);
      border-color: var(--chalk-yellow);
      color: var(--chalk-yellow);
      font-weight: bold;
    }

    .control-panel {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--chalk-gray);
      color: var(--chalk-white);
      padding: 8px 14px;
      font-size: 1.05rem;
      border-radius: 8px;
      font-family: inherit;
      outline: none;
    }
    .search-input:focus { border-color: var(--chalk-yellow); }

    .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-label { color: var(--chalk-blue); font-size: 1rem; font-weight: bold; min-width: 65px; }
    .tag-btn {
      background: rgba(0,0,0,0.3);
      border: 1px dashed var(--chalk-gray);
      color: var(--chalk-white);
      padding: 4px 10px;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-btn.active {
      border: 1px solid var(--chalk-yellow);
      background: rgba(254, 240, 138, 0.2);
      color: var(--chalk-yellow);
      font-weight: bold;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }
    .chalk-card {
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.4);
      transition: transform 0.25s, border-color 0.25s;
    }
    .chalk-card:hover { transform: translateY(-3px); border-color: var(--chalk-yellow); }
    .chalk-card.completed { border-color: var(--chalk-green); background: rgba(22, 101, 52, 0.15); }
    .chalk-card.completed::after {
      content: '✓ 已通關';
      position: absolute;
      top: 10px;
      right: 12px;
      color: var(--chalk-green);
      font-size: 0.85rem;
      border: 1px solid var(--chalk-green);
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.6);
      transform: rotate(3deg);
    }
    .chalk-card.completed.ref-done::after {
      content: '✓ 已閱讀';
      color: var(--chalk-blue);
      border-color: var(--chalk-blue);
    }

    .card-header { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .badge { font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; border: 1px dashed; }
    .badge-grade { color: var(--chalk-pink); border-color: var(--chalk-pink); }
    .badge-class { color: var(--chalk-orange); border-color: var(--chalk-orange); }
    .badge-group { color: var(--chalk-purple); border-color: var(--chalk-purple); font-weight: bold; background: rgba(216, 180, 254, 0.15); }
    .badge-subject { color: var(--chalk-yellow); border-color: var(--chalk-yellow); }
    .badge-type { color: var(--chalk-blue); border-color: var(--chalk-blue); }
    .badge-graded { color: #4ade80; border-color: #4ade80; background: rgba(74, 222, 128, 0.15); font-weight: bold; }
    .badge-ref { color: #94a3b8; border-color: #94a3b8; }

    .card-title { font-size: 1.25rem; color: var(--chalk-white); margin-bottom: 6px; line-height: 1.35; }
    .card-desc { color: rgba(245, 245, 240, 0.8); font-size: 0.95rem; margin-bottom: 14px; flex: 1; }

    .card-footer {
      border-top: 1px dashed rgba(255,255,255,0.2);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chalk-table-container {
      overflow-x: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      margin-top: 15px;
    }
    .chalk-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 1rem;
    }
    .chalk-table th, .chalk-table td {
      padding: 10px 14px;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
    }
    .chalk-table th {
      color: var(--chalk-yellow);
      border-bottom: 2px solid var(--chalk-white);
      background: rgba(0,0,0,0.4);
    }
    .chalk-table tr:hover { background: rgba(255,255,255,0.05); }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .note-bubble {
      background: rgba(0, 0, 0, 0.45);
      border-left: 4px solid var(--chalk-yellow);
      border-radius: 4px;
      padding: 10px 14px;
      font-size: 0.95rem;
      position: relative;
    }
    .note-bubble.is-teacher-prompt { border-left-color: var(--chalk-yellow); background: rgba(254, 240, 138, 0.12); }
    .note-bubble.is-question { border-left-color: var(--chalk-pink); }
    .note-bubble.is-reply { border-left-color: var(--chalk-green); margin-left: 20px; background: rgba(22, 101, 52, 0.2); }
    .note-meta {
      display: flex;
      justify-content: space-between;
      color: var(--chalk-gray);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #1e2c22;
      border: 4px solid var(--board-frame);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      color: var(--chalk-white);
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--chalk-gray);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .modal-title { color: var(--chalk-yellow); font-size: 1.5rem; }
    .close-modal-btn { background: none; border: none; color: var(--chalk-white); font-size: 1.8rem; cursor: pointer; }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; color: var(--chalk-yellow); font-size: 0.98rem; margin-bottom: 4px; }
    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--chalk-gray);
      color: var(--chalk-white);
      padding: 8px 12px;
      font-size: 0.98rem;
      border-radius: 6px;
      font-family: inherit;
      outline: none;
    }
    .form-control:focus { border-color: var(--chalk-yellow); }

    .student-select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--chalk-gray);
    }
    .student-checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .custom-fields-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .custom-field-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--chalk-gray);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.92rem;
    }
    .custom-field-title {
      color: var(--chalk-yellow);
      font-size: 0.82rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .chalk-tray {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px solid rgba(245, 245, 240, 0.2);
    }
    .chalk-stick { width: 40px; height: 10px; border-radius: 2px; }
    .eraser {
      width: 65px; height: 20px; background: #8b5a2b; border: 1px solid #5c3a1e;
      border-radius: 4px; margin-left: auto; position: relative;
    }
    .eraser::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 5px; background: #222;
    }
  </style>
</head>
<body>

  <div class="blackboard-frame">
    <div class="blackboard">
      
      <!-- 頂部導航與用戶面板 -->
      <header>
        <div class="title-area">
          <h1>🎯 課後黑板大冒險</h1>
          <p id="system-subtitle">
            S1–S6 粉筆闖關・全科自學修煉館
            <span id="sync-status" class="sync-status-badge sync-local">🟡 本機離線模式</span>
          </p>
        </div>

        <div class="user-badge-bar" id="user-bar"></div>
      </header>

      <!-- 主要功能 Tab 切換按鈕 -->
      <nav class="nav-tabs" id="main-nav-tabs"></nav>

      <!-- 視圖容器 -->
      <div id="view-container"></div>

      <!-- 黑板底槽 -->
      <div class="chalk-tray">
        <div class="chalk-stick" style="background: var(--chalk-white);"></div>
        <div class="chalk-stick" style="background: var(--chalk-yellow);"></div>
        <div class="chalk-stick" style="background: var(--chalk-blue);"></div>
        <div class="chalk-stick" style="background: var(--chalk-pink);"></div>
        <div class="chalk-stick" style="background: var(--chalk-green);"></div>
        <div class="eraser" title="黑板擦"></div>
      </div>

    </div>
  </div>

  <!-- 1. 統一登入 Modal -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content" style="max-width: 420px;">
      <div class="modal-header">
        <h2 class="modal-title">🔐 登入冒險</h2>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用戶名稱 (Username)</label>
          <input type="text" id="login-username" class="form-control" required autocomplete="username" placeholder="請輸入登入帳號">
        </div>
        <div class="form-group">
          <label class="form-label">密碼 (Password)</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password" placeholder="請輸入密碼">
        </div>
        <div style="margin-top: 20px;">
          <button type="submit" class="btn btn-yellow" style="width: 100%; justify-content: center;">開始自學冒險 🚀</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. 用戶自主修改密碼 Modal -->
  <div class="modal-overlay" id="change-pwd-modal">
    <div class="modal-content" style="max-width: 440px;">
      <div class="modal-header">
        <h2 class="modal-title">🔑 修改登入密碼</h2>
        <button class="close-modal-btn" onclick="closeModal('change-pwd-modal')">&times;</button>
      </div>
      <form id="change-pwd-form" onsubmit="saveUserSelfPassword(event)">
        <div class="form-group">
          <label class="form-label">目前舊密碼 *</label>
          <input type="password" id="pwd-old" class="form-control" required placeholder="請輸入當前密碼">
        </div>
        <div class="form-group">
          <label class="form-label">新密碼 *</label>
          <input type="password" id="pwd-new" class="form-control" required minlength="4" placeholder="請設定新密碼 (至少 4 位)">
        </div>
        <div class="form-group">
          <label class="form-label">確認新密碼 *</label>
          <input type="password" id="pwd-confirm" class="form-control" required minlength="4" placeholder="請再次輸入新密碼">
        </div>
        <div style="text-align: right; margin-top: 18px;">
          <button type="submit" class="btn btn-yellow">確認修改密碼</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. 教師/管理員發布與修改教材 Modal -->
  <div class="modal-overlay" id="resource-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="resource-modal-title">➕ 發布自學教材</h2>
        <button class="close-modal-btn" onclick="closeModal('resource-modal')">&times;</button>
      </div>
      <form id="resource-form" onsubmit="saveResource(event)">
        <input type="hidden" id="res-edit-id">
        <div class="form-group">
          <label class="form-label">課題標題 *</label>
          <input type="text" id="res-title" class="form-control" required placeholder="例：S4 資訊科技 - 網絡通訊協定跨班選修專案">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
          <div style="flex:1; min-width: 130px;">
            <label class="form-label">目標年級 *</label>
            <select id="res-grade" class="form-control" required onchange="updateTargetClassDropdown()">
              <option value="S1">中一 (S1)</option>
              <option value="S2">中二 (S2)</option>
              <option value="S3">中三 (S3)</option>
              <option value="S4">中四 (S4)</option>
              <option value="S5">中五 (S5)</option>
              <option value="S6">中六 (S6)</option>
            </select>
          </div>
          <div style="flex:1; min-width: 170px;">
            <label class="form-label">開放對象（行政班別 或 選修群組）*</label>
            <select id="res-target-class" class="form-control" required></select>
          </div>
          <div style="flex:1; min-width: 130px;">
            <label class="form-label">科目 *</label>
            <select id="res-subject" class="form-control" required></select>
          </div>
          <div style="flex:1; min-width: 130px;">
            <label class="form-label">教材類型 *</label>
            <select id="res-type" class="form-control" required></select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">自學重點與指引</label>
          <textarea id="res-desc" class="form-control" rows="2" placeholder="請填寫學習重點、必讀章節或觀看提示..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">資源鏈接 (URL / 影片嵌入 / 遊戲網址 / 講義雲端連結)</label>
          <input type="url" id="res-url" class="form-control" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">標籤 Tags (逗號分隔)</label>
          <input type="text" id="res-tags" class="form-control" placeholder="選修科, DSE核心, 跨班練習">
        </div>

        <!-- 隨堂測驗題目設定 -->
        <fieldset style="border: 1px dashed var(--chalk-orange); padding: 12px; border-radius: 8px; margin-top: 10px;">

    function syncToCloud() {
      localStorage.setItem('hk_bb_users', JSON.stringify(users));
      localStorage.setItem('hk_bb_categories', JSON.stringify(categories));
      localStorage.setItem('hk_bb_groups', JSON.stringify(customGroups));
      localStorage.setItem('hk_bb_resources', JSON.stringify(resources));
      localStorage.setItem('hk_bb_progress', JSON.stringify(progressMap));
      localStorage.setItem('hk_bb_notes', JSON.stringify(notesList));

      if (isCloudConnected && cloudDB) {
        cloudDB.ref('appData').set({
          users,
          categories,
          customGroups,
          resources,
          progressMap,
          notesList,
          updatedAt: Date.now()
        });
      }
    }

    function initCloudListener() {
      // 智慧 DOM 監聽防崩潰處理
      const updateBadge = (isOnline) => {
        const badge = document.getElementById('sync-status');
        if (badge) {
          if (isOnline) {
            badge.className = 'sync-status-badge sync-online';
            badge.innerHTML = '🟢 雲端已連線 (即時同步中)';
          } else {
            badge.className = 'sync-status-badge sync-local';
            badge.innerHTML = '🟡 本機離線模式';
          }
        }
      };

      if (isCloudConnected && cloudDB) {
        setTimeout(() => updateBadge(true), 150);

        cloudDB.ref('appData').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            if (val.users) users = val.users;
            if (val.categories) categories = val.categories;
            if (val.customGroups) customGroups = val.customGroups;
            if (val.resources) resources = val.resources;
            if (val.progressMap) progressMap = val.progressMap;
            if (val.notesList) notesList = val.notesList;

            const aIdx = users.findIndex(u => u.username === 'hkrsstpss');
            if (aIdx !== -1) users[aIdx].password = '26666821';

            if (currentUser) {
              const updatedCurr = users.find(u => u.username === currentUser.username);
              if (updatedCurr) {
                currentUser = updatedCurr;
                sessionStorage.setItem('hk_bb_current_user', JSON.stringify(currentUser));
              }

              // 只在 view-container 存在時才進行 DOM 更新，防堵空指針崩潰
              const viewContainer = document.getElementById('view-container');
              if (viewContainer) {
                if (currentTab === 'materials') renderCards();
                else if (currentTab === 'groups_manage') renderGroupsManageView(viewContainer);
                else if (currentTab === 'admin_users') switchTab('admin_users');
                else if (currentTab === 'admin_categories') switchTab('admin_categories');
                else if (currentTab === 'progress_report') switchTab('progress_report');
              }
            }
          }
        });
      } else {
        setTimeout(() => updateBadge(false), 150);
      }
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${tabId}'`));
      });

      const container = document.getElementById('view-container');
      if (!container) return;

        renderGroupsManageView(container);

       ========================================================================== */
    function renderGroupsManageView(container) {
      if (!container) return;
      container.innerHTML = `
        <div class="control-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
              <h3 style="color: var(--chalk-purple);">👥 高中跨班選修科 / 教學群組管理</h3>
              <p style="font-size:0.92rem; color:var(--chalk-gray);">
                跨班選修課、拔尖補底班之專屬分組。選修群組可透過「Excel 匯入多工作表」自動在學生名單中匹配與新增！
              </p>
            </div>
            <button class="btn btn-yellow" onclick="openCreateGroupModal()">➕ 新增選修群組</button>
          </div>
        </div>

        <div class="chalk-table-container">
          <table class="chalk-table">
            <thead>
              <tr>
                <th>年級</th>
                <th>選修群組名稱</th>
                <th>學生人數</th>
                <th>包含學生名單 (跨班)</th>
                <th>建立者 / 來源</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${customGroups.length === 0 ? `
                <tr><td colspan="6" style="text-align:center; color:var(--chalk-gray);">尚未建立任何選修群組。點擊上方按鈕建立，或由管理員以 Excel 批次匯入建立。</td></tr>
              ` : customGroups.map(grp => {
                const stuNames = (grp.studentUsernames || []).map(u => {
                  const s = users.find(x => x.username === u);
                  return s ? `${s.name || s.username}(${s.class || ''})` : u;
                }).join('、 ');

                return `
                  <tr>
                    <td><b>${grp.grade}</b></td>
                    <td><span class="badge badge-group">${escapeHtml(grp.name)}</span></td>
                    <td><b style="color:var(--chalk-green);">${grp.studentUsernames.length}</b> 人</td>
                    <td style="font-size:0.9rem; max-width:340px; color:rgba(255,255,255,0.85);">${stuNames || '無學生'}</td>
                    <td>${escapeHtml(grp.createdBy || '智慧匹配')}</td>
                    <td>
                      <button class="btn btn-sm btn-yellow" onclick="openEditGroupModal('${grp.id}')">✏️ 編輯名冊</button>
                      <button class="btn btn-sm btn-pink" onclick="deleteCustomGroup('${grp.id}')">🗑 刪除</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function openCreateGroupModal() {
      const form = document.getElementById('group-edit-form');
      if (form) form.reset();
      document.getElementById('group-edit-id').value = '';
      document.getElementById('group-edit-modal-title').textContent = '➕ 新增跨班選修群組';
      renderGroupStudentSelection();
      document.getElementById('group-edit-modal').classList.add('active');
    }

    function openEditGroupModal(grpId) {
      const grp = customGroups.find(g => g.id === grpId);
      if (!grp) return;

      document.getElementById('group-edit-modal-title').textContent = '✏️ 編輯跨班選修群組名冊';
      document.getElementById('group-edit-id').value = grp.id;
      document.getElementById('group-name').value = grp.name;
      document.getElementById('group-grade').value = grp.grade;

      renderGroupStudentSelection(grp.studentUsernames || []);
      document.getElementById('group-edit-modal').classList.add('active');
    }

    function renderGroupStudentSelection(selectedUsernames = []) {
      const grade = document.getElementById('group-grade').value;
      const gradeStudents = users.filter(u => u.role === 'student' && u.grade === grade);

      const grid = document.getElementById('group-student-checkbox-grid');
      if (!grid) return;
      grid.innerHTML = '';

      if (gradeStudents.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--chalk-gray);">名冊中無 ${grade} 學生。</div>`;
        updateGroupSelectedCount();
        return;
      }

      gradeStudents.sort((a,b) => (a.class || '').localeCompare(b.class || ''));

      gradeStudents.forEach(stu => {
        const isChecked = selectedUsernames.includes(stu.username);
        const label = document.createElement('label');
        label.className = 'student-checkbox-item';
        label.innerHTML = `
          <input type="checkbox" name="group_stu" value="${stu.username}" ${isChecked ? 'checked' : ''} onchange="updateGroupSelectedCount()">
          <span>[${stu.class || '-'}] <b>${escapeHtml(stu.name || stu.username)}</b></span>
        `;
        grid.appendChild(label);
      });

      updateGroupSelectedCount();
    }

    function updateGroupSelectedCount() {
      const checked = document.querySelectorAll('input[name="group_stu"]:checked').length;
      const counter = document.getElementById('group-selected-count');
      if (counter) counter.textContent = checked;
    }

    function toggleSelectAllGroupStudents(check) {
      document.querySelectorAll('input[name="group_stu"]').forEach(box => {
        if (box.parentElement.style.display !== 'none') {
          box.checked = check;
        }
      });
      updateGroupSelectedCount();
    }

    function filterGroupStudentCheckboxes(keyword) {
      const kw = keyword.trim().toLowerCase();
      document.querySelectorAll('#group-student-checkbox-grid label').forEach(lbl => {
        const text = lbl.textContent.toLowerCase();
        lbl.style.display = text.includes(kw) ? 'flex' : 'none';
      });
    }

    function saveCustomGroup(e) {
      e.preventDefault();
      const editId = document.getElementById('group-edit-id').value;
      const name = document.getElementById('group-name').value.trim();
      const grade = document.getElementById('group-grade').value;

      const checkedUsernames = Array.from(document.querySelectorAll('input[name="group_stu"]:checked')).map(box => box.value);

      if (checkedUsernames.length === 0) {
        if (!confirm('此群組尚未選取任何跨班學生，確定要儲存嗎？')) return;
      }

      if (editId) {
        const idx = customGroups.findIndex(g => g.id === editId);
        if (idx !== -1) {
          customGroups[idx] = {
            ...customGroups[idx],
            name, grade,
            studentUsernames: checkedUsernames
          };
          alert('✅ 選修群組名冊已更新！');
        }
      } else {
        const newGroup = {
          id: 'grp_' + Date.now(),
          name, grade,
          createdBy: currentUser.name || currentUser.username,
          studentUsernames: checkedUsernames
        };
        customGroups.push(newGroup);
        alert('✅ 新選修群組已成功建立！');
      }

      // 同步更新學生的 electives 屬性
      users.forEach(u => {
        if (u.role === 'student' && u.grade === grade) {
          if (!u.electives) u.electives = [];
          if (checkedUsernames.includes(u.username)) {
            if (!u.electives.includes(name)) u.electives.push(name);
          } else {
            u.electives = u.electives.filter(el => el !== name);
          }
        }
      });

      syncToCloud();
      closeModal('group-edit-modal');
      renderGroupsManageView(document.getElementById('view-container'));
    }

    function deleteCustomGroup(grpId) {
      const grp = customGroups.find(g => g.id === grpId);
      if (confirm(`確定要刪除選修群組【${grp ? grp.name : ''}】嗎？(教材指派將不再對該組開放)`)) {
        if (grp) {
          users.forEach(u => {
            if (u.electives) {
              u.electives = u.electives.filter(el => el !== grp.name);
            }
          });
        }
        customGroups = customGroups.filter(g => g.id !== grpId);
        syncToCloud();
        renderGroupsManageView(document.getElementById('view-container'));
      }
    }

    /* ==========================================================================
       6. 視圖 1：自學課題黑板 (核心隔離與渲染)
       ========================================================================== */
    function renderMaterialsView(container) {
      if (!container) return;
      container.innerHTML = `
        <div class="control-panel">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 搜尋課題名稱、概念、標籤或發布老師..." oninput="handleSearch(this.value)">
            ${currentUser.role !== 'student' ? '<button class="btn btn-yellow" onclick="openResourceModal()">➕ 發布新教材</button>' : ''}
          </div>

          <div class="filter-group">
            <span class="filter-label">📅 年級：</span>
            ${currentUser.role === 'student' ? 
              `<button class="tag-btn active">${currentUser.grade} (我的年級)</button>` :
              `<button class="tag-btn ${filterState.grade === 'ALL' ? 'active' : ''}" onclick="setFilter('grade', 'ALL')">全部</button>
               <button class="tag-btn ${filterState.grade === 'S1' ? 'active' : ''}" onclick="setFilter('grade', 'S1')">中一</button>
               <button class="tag-btn ${filterState.grade === 'S2' ? 'active' : ''}" onclick="setFilter('grade', 'S2')">中二</button>
               <button class="tag-btn ${filterState.grade === 'S3' ? 'active' : ''}" onclick="setFilter('grade', 'S3')">中三</button>
               <button class="tag-btn ${filterState.grade === 'S4' ? 'active' : ''}" onclick="setFilter('grade', 'S4')">中四</button>
               <button class="tag-btn ${filterState.grade === 'S5' ? 'active' : ''}" onclick="setFilter('grade', 'S5')">中五</button>
               <button class="tag-btn ${filterState.grade === 'S6' ? 'active' : ''}" onclick="setFilter('grade', 'S6')">中六</button>`
            }
          </div>

          <div class="filter-group">
            <span class="filter-label">📚 學科：</span>
            <button class="tag-btn ${filterState.subject === 'ALL' ? 'active' : ''}" onclick="setFilter('subject', 'ALL')">全部學科</button>
            ${categories.subjects.map(sub => `
              <button class="tag-btn ${filterState.subject === sub ? 'active' : ''}" onclick="setFilter('subject', '${sub}')">${sub}</button>
            `).join('')}
          </div>

          <div class="filter-group">
            <span class="filter-label">🏷️ 類型：</span>
            <button class="tag-btn ${filterState.type === 'ALL' ? 'active' : ''}" onclick="setFilter('type', 'ALL')">全部類型</button>
            ${categories.types.map(t => `
              <button class="tag-btn ${filterState.type === t.id ? 'active' : ''}" onclick="setFilter('type', '${t.id}')">${t.label}</button>
            `).join('')}
          </div>
        </div>

        <main class="resource-grid" id="resource-cards-grid"></main>
      `;

      renderCards();
    }

    function isStudentEligibleForResource(student, res) {
      if (student.grade !== res.grade) return false;
      if (res.targetClass === 'ALL') return true;

      const studentElectives = Array.isArray(student.electives) ? student.electives : [];

      if (res.targetClass.startsWith('GROUP:')) {
        const grpId = res.targetClass.replace('GROUP:', '');
        const grp = customGroups.find(g => g.id === grpId);
        if (!grp) return false;
        return (grp.studentUsernames || []).includes(student.username) || studentElectives.includes(grp.name);
      }

      return student.class && student.class.includes(res.targetClass);
    }

    function isResourceCompleted(username, resId) {
      const userProg = progressMap[username];
      if (!userProg) return false;
      if (Array.isArray(userProg)) return userProg.includes(resId);
      return !!userProg[resId];
    }

    function renderCards() {
      const grid = document.getElementById('resource-cards-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const visibleList = resources.filter(res => {
        if (currentUser.role === 'student') {
          if (!isStudentEligibleForResource(currentUser, res)) return false;
        }

        const matchGrade = filterState.grade === 'ALL' || res.grade === filterState.grade;
        const matchSubject = filterState.subject === 'ALL' || res.subject === filterState.subject;
        const matchType = filterState.type === 'ALL' || res.type === filterState.type;

        let matchSearch = true;
        if (filterState.search) {
          const s = filterState.search.toLowerCase();
          const inTitle = res.title.toLowerCase().includes(s);
          const inDesc = (res.desc || '').toLowerCase().includes(s);
          const inTags = (res.tags || []).some(t => t.toLowerCase().includes(s));
          const inTeacher = (res.createdBy || '').toLowerCase().includes(s);
          matchSearch = inTitle || inDesc || inTags || inTeacher;
        }

        return matchGrade && matchSubject && matchType && matchSearch;
      });

      if (visibleList.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--chalk-gray); font-size: 1.2rem;">
            💨 暫無符合條件的自學課題材料。
          </div>
        `;
        return;
      }

      visibleList.forEach(res => {
        const hasQuiz = res.quiz && res.quiz.question && res.quiz.question.trim() !== '';
        const isDone = isResourceCompleted(currentUser.username, res.id);
        const card = document.createElement('div');
        card.className = `chalk-card ${isDone ? 'completed' : ''} ${!hasQuiz && isDone ? 'ref-done' : ''}`;

        const typeObj = categories.types.find(t => t.id === res.type);
        const typeLabel = typeObj ? typeObj.label : res.type;

        let targetText = '全級開放';
        let targetBadgeClass = 'badge-class';
        if (res.targetClass.startsWith('GROUP:')) {
          const grpId = res.targetClass.replace('GROUP:', '');
          const grp = customGroups.find(g => g.id === grpId);
          targetText = grp ? `選修: ${grp.name}` : '自訂組別';
          targetBadgeClass = 'badge-group';
        } else if (res.targetClass !== 'ALL') {
          targetText = `${res.targetClass} 班專用`;
        }

        const notesCount = notesList.filter(n => n.resId === res.id).length;
        const completedStudentCount = users.filter(u => u.role === 'student' && isStudentEligibleForResource(u, res) && isResourceCompleted(u.username, res.id)).length;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="badge badge-grade">[${res.grade}]</span>
              <span class="badge ${targetBadgeClass}">${targetText}</span>
              <span class="badge badge-subject">${res.subject}</span>
              <span class="badge badge-type">${typeLabel}</span>
              ${hasQuiz ? '<span class="badge badge-graded">🎯 計分課題</span>' : '<span class="badge badge-ref">📖 參考資料 (不計分)</span>'}
            </div>
            <h3 class="card-title">${escapeHtml(res.title)}</h3>
            <p class="card-desc">${escapeHtml(res.desc || '暫無描述指引')}</p>
            <div style="font-size: 0.85rem; color: var(--chalk-gray); margin-bottom: 8px;">
              👨‍🏫 發布者：${res.createdBy || '科任老師'}
            </div>
          </div>

          <div class="card-footer">
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              ${res.url ? `<a href="${res.url}" target="_blank" class="btn btn-sm btn-yellow">↗ 打開教材</a>` : ''}
              ${hasQuiz ? `<button class="btn btn-sm btn-pink" onclick="startQuiz('${res.id}')">✍ 隨堂自測 (答對加分)</button>` : ''}
              <button class="btn btn-sm" onclick="openNotesModal('${res.id}')">💬 筆記/提問 (${notesCount})</button>

              ${currentUser.role !== 'student' ? `
                <button class="btn btn-sm btn-blue" onclick="openCompletionModal('${res.id}')">👥 完成名單 (${completedStudentCount})</button>
              ` : ''}
            </div>

            <div style="display: flex; gap: 6px; align-items: center;">
              ${currentUser.role === 'student' ? (
                hasQuiz ? `
                  <span style="font-size: 0.88rem; color: ${isDone ? 'var(--chalk-green)' : 'var(--chalk-orange)'};">
                    ${isDone ? '✓ 測驗已通過 (+1分)' : '⏳ 需完成測驗加分'}
                  </span>
                ` : `
                  <button class="btn btn-sm ${isDone ? 'btn-blue' : ''}" onclick="toggleStudentRefRead('${res.id}')">
                    ${isDone ? '✓ 已閱讀' : '○ 標記已閱'}
                  </button>
                `
              ) : `
                <button class="btn btn-sm btn-yellow" onclick="openEditResourceModal('${res.id}')">✏️ 編輯</button>
                <button class="btn btn-sm btn-pink" onclick="deleteResource('${res.id}')">🗑 刪除</button>
              `}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* ==========================================================================
       7. 查看教材完成名單
       ========================================================================== */
    function filterCompletionByClassSelect(cls) {
      activeCompletionClassFilter = cls;
      renderCompletionList();
    }

    function filterCompletionSearch(val) {
      activeCompletionSearchKeyword = val.trim().toLowerCase();
      renderCompletionList();
    }

    function renderCompletionList() {
      const res = resources.find(r => r.id === activeCompletionResId);
      if (!res) return;

      let eligibleStudents = users.filter(u => u.role === 'student' && isStudentEligibleForResource(u, res));

      if (activeCompletionClassFilter !== 'ALL') {
        eligibleStudents = eligibleStudents.filter(u => u.class === activeCompletionClassFilter);
      }

      if (activeCompletionSearchKeyword) {
        eligibleStudents = eligibleStudents.filter(u => 
          (u.name && u.name.toLowerCase().includes(activeCompletionSearchKeyword)) ||
          u.username.toLowerCase().includes(activeCompletionSearchKeyword)
        );
      }

      let completedCount = 0;
      const tbody = document.getElementById('completion-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (eligibleStudents.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--chalk-gray);">此條件下沒有學生資料。</td></tr>`;
      } else {
        eligibleStudents.forEach(stu => {
          const isDone = isResourceCompleted(stu.username, res.id);
          let timeDone = '-';
          if (isDone && progressMap[stu.username] && progressMap[stu.username][res.id]) {
            timeDone = progressMap[stu.username][res.id].timestamp || '已完成';
          }
          if (isDone) completedCount++;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${stu.grade || ''} (${stu.class || '-'})</b></td>
            <td>${stu.username}</td>
            <td>${stu.name || stu.username}</td>
            <td>
              ${isDone ? '<span style="color:var(--chalk-green); font-weight:bold;">✓ 已完成</span>' : '<span style="color:var(--chalk-pink);">⏳ 未完成</span>'}
            </td>
            <td style="font-size:0.9rem; color:var(--chalk-gray);">${timeDone}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      const hasQuiz = res.quiz && res.quiz.question;
      const percent = eligibleStudents.length > 0 ? Math.round((completedCount / eligibleStudents.length) * 100) : 0;
      const summaryText = document.getElementById('completion-summary');
      if (summaryText) {
        summaryText.innerHTML = `
          課題性質：<b>${hasQuiz ? '🎯 計分課題' : '📖 參考資料'}</b> ｜ 
          對象：<b>${res.targetClass.startsWith('GROUP:') ? '跨班選修組' : '行政班別'}</b> ｜ 
          完成進度：<b style="color:var(--chalk-green); font-size:1.15rem;">${completedCount}</b> / ${eligibleStudents.length} 人 (${percent}%)
        `;
      }
    }

    /* ==========================================================================
       8. 查看個別學生練習明細
       ========================================================================== */
    function openStudentDetailModal(username) {
      activeStudentDetailUsername = username;
      activeStudentDetailTypeFilter = 'ALL';
      renderStudentDetailModalContent();
      document.getElementById('student-detail-modal').classList.add('active');
    }

    function filterStudentDetailView(filterType) {
      activeStudentDetailTypeFilter = filterType;
      document.querySelectorAll('#student-detail-modal .tag-btn').forEach(btn => btn.classList.remove('active'));
      if (filterType === 'ALL') document.getElementById('filter-stu-detail-all').classList.add('active');
      else if (filterType === 'GRADED') document.getElementById('filter-stu-detail-graded').classList.add('active');
      else if (filterType === 'REF') document.getElementById('filter-stu-detail-ref').classList.add('active');
      renderStudentDetailModalContent();
    }

    function renderStudentDetailModalContent() {
      const stu = users.find(u => u.username === activeStudentDetailUsername);
      if (!stu) return;

      const summaryText = document.getElementById('student-detail-summary');
      const electivesText = (Array.isArray(stu.electives) && stu.electives.length > 0) ? stu.electives.join(', ') : '無選修科紀錄';
      
      const assignedRes = resources.filter(r => isStudentEligibleForResource(stu, r));
      const gradedRes = assignedRes.filter(r => r.quiz && r.quiz.question && r.quiz.question.trim() !== '');
      const refRes = assignedRes.filter(r => !r.quiz || !r.quiz.question || r.quiz.question.trim() === '');

      const gradedDoneCount = gradedRes.filter(r => isResourceCompleted(stu.username, r.id)).length;
      const refDoneCount = refRes.filter(r => isResourceCompleted(stu.username, r.id)).length;

      if (summaryText) {
        summaryText.innerHTML = `
          學生班別：<b>${stu.grade || ''} (${stu.class || ''})</b> ｜ 
          帳號：<b>${stu.username}</b> ｜ 
          選修科目：<b style="color:var(--chalk-purple);">${electivesText}</b><br>
          測驗得分：<b style="color:var(--chalk-green); font-size:1.15rem;">${gradedDoneCount}</b> / ${gradedRes.length} 分 ｜ 
          參考資料閱讀：<b style="color:var(--chalk-blue);">${refDoneCount}</b> / ${refRes.length} 篇
        `;
      }

      const customArea = document.getElementById('student-custom-fields-area');
      if (customArea) {
        customArea.innerHTML = '';
        if (stu.extraFields && typeof stu.extraFields === 'object') {
          Object.entries(stu.extraFields).forEach(([key, val]) => {
            if (val && String(val).trim() !== '') {
              const card = document.createElement('div');
              card.className = 'custom-field-card';
              card.innerHTML = `
                <div class="custom-field-title">📎 ${escapeHtml(key)}</div>
                <div><b>${escapeHtml(val)}</b></div>
              `;
              customArea.appendChild(card);
            }
          });
        }
      }

      let displayList = assignedRes;
      if (activeStudentDetailTypeFilter === 'GRADED') displayList = gradedRes;
      else if (activeStudentDetailTypeFilter === 'REF') displayList = refRes;

      const tbody = document.getElementById('student-detail-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (displayList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--chalk-gray);">此分類暫無課題。</td></tr>`;
      } else {
        displayList.forEach(r => {
          const hasQuiz = r.quiz && r.quiz.question && r.quiz.question.trim() !== '';
          const isDone = isResourceCompleted(stu.username, r.id);
          let timeDone = '-';
          if (isDone && progressMap[stu.username] && progressMap[stu.username][r.id]) {
            timeDone = progressMap[stu.username][r.id].timestamp || '已完成';
          }

          let statusHtml = '';
          if (hasQuiz) {
            statusHtml = isDone ? 
              '<span style="color:var(--chalk-green); font-weight:bold;">✓ 測驗通過 (+1分)</span>' : 
              '<span style="color:var(--chalk-pink);">⏳ 未完成測驗</span>';
          } else {
            statusHtml = isDone ? 
              '<span style="color:var(--chalk-blue); font-weight:bold;">✓ 已自主閱讀</span>' : 
              '<span style="color:var(--chalk-gray);">○ 尚未閱讀</span>';
          }

          const typeObj = categories.types.find(t => t.id === r.type);
          const typeLabel = typeObj ? typeObj.label : r.type;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${escapeHtml(r.title)}</b></td>
            <td>${r.subject}</td>
            <td>${typeLabel}</td>
            <td>${hasQuiz ? '<span class="badge badge-graded">🎯 計分測驗</span>' : '<span class="badge badge-ref">📖 參考資料</span>'}</td>
            <td>${statusHtml}</td>
            <td style="font-size:0.9rem; color:var(--chalk-gray);">${timeDone}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    /* ==========================================================================
       9. 討論區與隨堂自測邏輯
       ========================================================================== */
    function postNote(e) {
      e.preventDefault();
      const content = document.getElementById('note-content').value.trim();
      const noteType = document.getElementById('note-type').value;
      if (!content) return;

      const newEntry = {
        id: 'note_' + Date.now(),
        resId: currentNoteResId,
        replyToId: currentReplyToId,
        userId: currentUser.id,
        authorName: `${currentUser.name || currentUser.username} ${currentUser.role === 'student' ? `(${currentUser.class || ''})` : ''}`,
        role: currentUser.role,
        type: noteType,
        text: content,
        time: getNowTimeStr()
      };

      notesList.push(newEntry);
      syncToCloud();

      document.getElementById('note-content').value = '';
      cancelReply();
      renderNotesList();
      renderCards();
    }

    function startQuiz(resId) {
      const res = resources.find(r => r.id === resId);
      if (!res || !res.quiz) return;

      currentActiveQuizRes = res;
      document.getElementById('quiz-run-title').textContent = `🎯 ${res.title} - 隨堂自測`;
      document.getElementById('quiz-run-q').textContent = res.quiz.question;

      renderQuizOptionButtons();
      document.getElementById('quiz-run-modal').classList.add('active');
    }

    function renderQuizOptionButtons() {
      const optContainer = document.getElementById('quiz-run-options');
      optContainer.innerHTML = '';
      document.getElementById('quiz-run-feedback').style.display = 'none';
      document.getElementById('quiz-run-done-btn').style.display = 'none';
      document.getElementById('quiz-retry-btn').style.display = 'none';

      currentActiveQuizRes.quiz.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-yellow quiz-choice-btn';
        btn.style.textAlign = 'left';
        btn.style.justifyContent = 'flex-start';
        btn.textContent = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
        btn.onclick = () => checkQuiz(idx, currentActiveQuizRes.quiz);
        optContainer.appendChild(btn);
      });
    }

    function checkQuiz(selectedIdx, quiz) {
      document.querySelectorAll('.quiz-choice-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('quiz-run-feedback');
      fb.style.display = 'block';

      if (selectedIdx === quiz.correct) {
        fb.style.background = 'rgba(134, 239, 172, 0.2)';
        fb.style.border = '1px solid var(--chalk-green)';
        fb.style.color = 'var(--chalk-green)';
        fb.innerHTML = `🎉 <b>回答完全正確！(+1 分)</b><br>${quiz.explanation ? '💡 解析：' + quiz.explanation : ''}`;
        
        if (currentUser.role === 'student') {
          document.getElementById('quiz-run-done-btn').style.display = 'inline-block';
        }
        document.getElementById('quiz-retry-btn').style.display = 'none';
      } else {
        fb.style.background = 'rgba(244, 114, 182, 0.2)';
        fb.style.border = '1px solid var(--chalk-pink)';
        fb.style.color = 'var(--chalk-pink)';
        fb.innerHTML = `❌ <b>答案不正確喔！</b><br>請重新閱讀或觀看教材內容，再試一次吧！`;
        
        document.getElementById('quiz-run-done-btn').style.display = 'none';
        document.getElementById('quiz-retry-btn').style.display = 'inline-block';
      }
    }

    function retryQuiz() {
      renderQuizOptionButtons();
    }

    function markResourceDoneFromQuiz() {
      if (currentActiveQuizRes) {
        const u = currentUser.username;
        if (!progressMap[u]) progressMap[u] = {};
        if (Array.isArray(progressMap[u])) {
          const set = new Set(progressMap[u]);
          set.add(currentActiveQuizRes.id);
          const obj = {};
          set.forEach(id => obj[id] = { completed: true, timestamp: getNowTimeStr() });
          progressMap[u] = obj;
        } else {
          progressMap[u][currentActiveQuizRes.id] = { completed: true, timestamp: getNowTimeStr() };
        }

        syncToCloud();
        closeModal('quiz-run-modal');
        renderCards();
        alert('🎉 恭喜！測驗已通過並已記入自學成績！');
      }
    }

    /* ==========================================================================
       10. 教材發布與修改 (開放班級聯動選修群組)
       ========================================================================== */
    function updateTargetClassDropdown(selectedValue = 'ALL') {
      const grade = document.getElementById('res-grade').value;
      const sel = document.getElementById('res-target-class');
      
      const gradeStudents = users.filter(u => u.role === 'student' && u.grade === grade);
      const classSet = new Set();
      gradeStudents.forEach(s => { if (s.class) classSet.add(s.class); });
      const classList = Array.from(classSet).sort();

      const gradeGroups = customGroups.filter(g => g.grade === grade);

      let optionsHtml = `<option value="ALL">全級通用 (All Classes)</option>`;

      if (classList.length > 0) {
        optionsHtml += `<optgroup label="── 行政班別 ──">`;
        classList.forEach(c => {
          optionsHtml += `<option value="${c}">${c} 班</option>`;
        });
        optionsHtml += `</optgroup>`;
      }

      if (gradeGroups.length > 0) {
        optionsHtml += `<optgroup label="── 跨班選修科群組 ──">`;
        gradeGroups.forEach(g => {
          optionsHtml += `<option value="GROUP:${g.id}">👥 ${g.name} (${g.studentUsernames.length}人)</option>`;
        });
        optionsHtml += `</optgroup>`;
      }

      if (sel) {
        sel.innerHTML = optionsHtml;
        sel.value = selectedValue;
      }
    }

    function openResourceModal() {
      const subSel = document.getElementById('res-subject');
      if (subSel) subSel.innerHTML = categories.subjects.map(s => `<option value="${s}">${s}</option>`).join('');

      const typeSel = document.getElementById('res-type');
      if (typeSel) typeSel.innerHTML = categories.types.map(t => `<option value="${t.id}">${t.label}</option>`).join('');

      const form = document.getElementById('resource-form');
      if (form) form.reset();
      document.getElementById('res-edit-id').value = '';
      document.getElementById('resource-modal-title').textContent = '➕ 發布自學教材';
      document.getElementById('res-submit-btn').textContent = '確認儲存並發布';

      updateTargetClassDropdown('ALL');
      document.getElementById('resource-modal').classList.add('active');
    }

    function openEditResourceModal(resId) {
      const res = resources.find(r => r.id === resId);
      if (!res) return;

      openResourceModal();
      document.getElementById('resource-modal-title').textContent = '✏️ 編輯自學教材';
      document.getElementById('res-submit-btn').textContent = '儲存修改';
      document.getElementById('res-edit-id').value = res.id;

      document.getElementById('res-title').value = res.title || '';
      document.getElementById('res-grade').value = res.grade || 'S4';
      updateTargetClassDropdown(res.targetClass || 'ALL');

      document.getElementById('res-subject').value = res.subject || categories.subjects[0];
      document.getElementById('res-type').value = res.type || categories.types[0].id;
      document.getElementById('res-desc').value = res.desc || '';
      document.getElementById('res-url').value = res.url || '';
      document.getElementById('res-tags').value = (res.tags || []).join(', ');

      if (res.quiz && res.quiz.question) {
        document.getElementById('res-quiz-q').value = res.quiz.question;
        document.getElementById('res-quiz-opt0').value = res.quiz.options?.[0] || '';
        // ⭐️【重點修復】修正舊版本殘存的 JavaScript 語法錯誤（即將 options?. 修正為 options?.[index]）
        document.getElementById('res-quiz-opt1').value = res.quiz.options?.[1] || '';
        document.getElementById('res-quiz-opt2').value = res.quiz.options?.[2] || '';
        document.getElementById('res-quiz-opt3').value = res.quiz.options?.[3] || '';
        document.getElementById('res-quiz-ans').value = res.quiz.correct ?? 0;
        document.getElementById('res-quiz-exp').value = res.quiz.explanation || '';
      }
    }

    function saveResource(e) {
      e.preventDefault();
      const editId = document.getElementById('res-edit-id').value;
      const title = document.getElementById('res-title').value.trim();
      const grade = document.getElementById('res-grade').value;
      const targetClass = document.getElementById('res-target-class').value;
      const subject = document.getElementById('res-subject').value;
      const type = document.getElementById('res-type').value;
      const desc = document.getElementById('res-desc').value.trim();
      const url = document.getElementById('res-url').value.trim();
      const tags = document.getElementById('res-tags').value.split(',').map(t => t.trim()).filter(Boolean);

      const qText = document.getElementById('res-quiz-q').value.trim();
      let quiz = null;
      if (qText) {
        quiz = {
          question: qText,
          options: [
            document.getElementById('res-quiz-opt0').value || '選項 A',
            document.getElementById('res-quiz-opt1').value || '選項 B',
            document.getElementById('res-quiz-opt2').value || '選項 C',
            document.getElementById('res-quiz-opt3').value || '選項 D'
          ],
          correct: parseInt(document.getElementById('res-quiz-ans').value),
          explanation: document.getElementById('res-quiz-exp').value.trim()
        };
      }

      if (editId) {
        const idx = resources.findIndex(r => r.id === editId);
        if (idx !== -1) {
          resources[idx] = {
            ...resources[idx],
            title, grade, targetClass, subject, type, desc, url, tags, quiz
          };
          alert('✅ 教材內容修改已儲存！');
        }
      } else {
        const newRes = {
          id: 'res_' + Date.now(),
          title, grade, targetClass, subject, type, desc, url, tags,
          createdBy: currentUser.name || currentUser.username,
          quiz
        };
        resources.unshift(newRes);
        alert(`✅ 教材已成功發布！(${quiz ? '🎯 計分測驗課題' : '📖 參考資料'})`);
      }

      syncToCloud();
      closeModal('resource-modal');
      renderCards();
    }

    function deleteResource(resId) {
      if (confirm('確定要從黑板刪除此課題教材嗎？')) {
        resources = resources.filter(r => r.id !== resId);
        syncToCloud();
        renderCards();
      }
    }

    /* ==========================================================================
       11. 智慧多工作表 Excel 匯入引擎與擴充欄精確解析
       ========================================================================== */
    function importUsersExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          let addedCount = 0;
          let newGroupsCreated = 0;

          workbook.SheetNames.forEach(sheetName => {
            const worksheet = workbook.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' }); [cite: 2]

            if (!rawRows || rawRows.length === 0) return;

            rawRows.forEach(row => {
              if (!row || typeof row !== 'object' || Object.keys(row).length === 0) return;

              let role = 'student', username = '', password = '123456', name = '', grade = '', cls = '', subject = '';
              let electivesStr = '';
              let extraFields = {};

              const mapKeys = {
                role: ['role', '身份', '身份(role)', '身份角色', '角色'],
                username: ['username', '用戶名稱', '帳號', '學號', '用戶名稱(username)', '用戶名稱/學生帳號'],
                password: ['password', '密碼', '密碼(password)', 'pwd'],
                name: ['name', '姓名', '姓名(name)', '學生姓名'],
                grade: ['grade', '年級', '年級(grade)'],
                cls: ['class', '班別', '班別(class)', '班', '班級'],
                subject: ['subject', '學科', '任教學科', '任教學科(subject)', '任教科目', '科目'],
                electives: ['electives', '選修科', '選修科/群組', '選修科/群組(electives)', '選修科群組', '選修']
              };

              Object.entries(row).forEach(([key, val]) => {
                if (key === undefined || val === undefined) return;
                const kClean = key.trim().toLowerCase();
                const vClean = String(val).trim();

                const matches = (arr) => arr.some(pattern => kClean === pattern || kClean.includes(pattern));

                if (matches(mapKeys.username)) username = vClean;
                else if (matches(mapKeys.password)) password = vClean;
                else if (matches(mapKeys.role)) role = vClean;
                else if (matches(mapKeys.name)) name = vClean;
                else if (matches(mapKeys.grade)) grade = vClean.toUpperCase();
                else if (matches(mapKeys.cls)) cls = vClean.toUpperCase();
                else if (matches(mapKeys.subject)) subject = vClean;
                else if (matches(mapKeys.electives)) electivesStr = vClean;
                else {
                  extraFields[key] = vClean;
                }
              });

              if (!username) return;

              const cleanRole = role.toLowerCase().includes('teach') ? 'teacher' : (role.toLowerCase().includes('admin') ? 'admin' : 'student');
              const cleanName = name || username;
              const parsedElectives = electivesStr ? electivesStr.split(/[,，;；、/]/).map(s => s.trim()).filter(Boolean) : [];

              const existingIdx = users.findIndex(u => u.username === username);
              const userData = {
                id: 'u_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                role: cleanRole,
                username: username,
                password: password || '123456',
                name: cleanName,
                grade,
                class: cls,
                subject,
                electives: parsedElectives,
                extraFields
              };

              if (existingIdx !== -1) {
                if (username !== 'hkrsstpss') {
                  users[existingIdx] = { ...users[existingIdx], ...userData };
                }
              } else {
                users.push(userData);
                addedCount++;
              }

              if (cleanRole === 'student' && grade && parsedElectives.length > 0) {
                parsedElectives.forEach(grpName => {
                  let existingGroup = customGroups.find(g => g.name.toLowerCase() === grpName.toLowerCase() && g.grade === grade);
                  if (existingGroup) {
                    if (!existingGroup.studentUsernames.includes(username)) {
                      existingGroup.studentUsernames.push(username);
                    }
                  } else {
                    const newGrp = {
                      id: 'grp_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                      name: grpName,
                      grade: grade,
                      createdBy: 'Excel 智慧解析自動建立',
                      studentUsernames: [username]
                    };
                    customGroups.push(newGrp);
                    newGroupsCreated++;
                  }
                });
              }
            });
          });

          syncToCloud();
          switchTab('admin_users');
          alert(`🎉 智慧匯入成功！\n• 已完全遍歷掃描所有工作表 (Sheet)\n• 匯入 / 更新了 ${addedCount} 個帳戶\n• 智慧匹配並自動建立 ${newGroupsCreated} 個新跨班選修群組\n• 已完整載入自訂欄位！`);
        } catch (err) {
          console.error(err);
          alert('❌ Excel 解析失敗，請確認檔案格式是否正確。');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function deleteUser(uid) {
      if (confirm('確定刪除該帳號嗎？')) {
        const u = users.find(x => x.id === uid);
        if (u) {
          customGroups.forEach(g => {
            g.studentUsernames = g.studentUsernames.filter(un => un !== u.username);
          });
        }
        users = users.filter(u => u.id !== uid);
        syncToCloud();
        switchTab('admin_users');
      }
    }

    /* ==========================================================================
       12. 進度統計報表
       ========================================================================== */
    function renderProgressReportView(container) {
      if (!container) return;
      const studentUsers = users.filter(u => u.role === 'student');
      const classSet = new Set();
      studentUsers.forEach(s => { if (s.class) classSet.add(s.class); });
      const classList = Array.from(classSet).sort();

      let filteredStudents = studentUsers;
      if (progressReportClassFilter.startsWith('GROUP:')) {
        const grpId = progressReportClassFilter.replace('GROUP:', '');
        const grp = customGroups.find(g => g.id === grpId);
        const groupUids = grp ? grp.studentUsernames : [];
        filteredStudents = studentUsers.filter(s => groupUids.includes(s.username));
      } else if (progressReportClassFilter !== 'ALL') {
        filteredStudents = studentUsers.filter(s => s.class === progressReportClassFilter);
      }

      container.innerHTML = `
        <div class="control-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
              <h3 style="color: var(--chalk-green);">📊 學生自學測驗成績與進度報表</h3>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="color: var(--chalk-yellow); font-size: 0.95rem;">篩選對象：</span>
                <select id="report-class-filter" class="form-control" style="width: 170px; padding: 4px 8px;" onchange="filterProgressReportByClass(this.value)">
                  <option value="ALL">全部學生</option>
                  <optgroup label="── 行政班別 ──">
                    ${classList.map(c => `<option value="${c}" ${progressReportClassFilter === c ? 'selected' : ''}>${c} 班</option>`).join('')}
                  </optgroup>
                  ${customGroups.length > 0 ? `
                    <optgroup label="── 跨班選修群組 ──">
                      ${customGroups.map(g => `<option value="GROUP:${g.id}" ${progressReportClassFilter === 'GROUP:' + g.id ? 'selected' : ''}>👥 ${g.name}</option>`).join('')}
                    </optgroup>
                  ` : ''}
                </select>
              </div>
            </div>
            <button class="btn btn-green" onclick="exportProgressReportExcel()">📥 匯出進度報表 (Excel)</button>
          </div>
        </div>

        <div class="chalk-table-container">
          <table class="chalk-table">
            <thead>
              <tr>
                <th>年級 / 班別</th>
                <th>學生帳號</th>
                <th>學生姓名</th>
                <th>測驗得分 (滿分)</th>
                <th>測驗得分率</th>
                <th>參考資料已閱數</th>
                <th>練習明細</th>
              </tr>
            </thead>
            <tbody>
              ${filteredStudents.length === 0 ? `
                <tr><td colspan="7" style="text-align:center; color:var(--chalk-gray);">此條件下暫無學生資料。</td></tr>
              ` : filteredStudents.map(stu => {
                const assignedRes = resources.filter(r => isStudentEligibleForResource(stu, r));
                const gradedRes = assignedRes.filter(r => r.quiz && r.quiz.question && r.quiz.question.trim() !== '');
                const refRes = assignedRes.filter(r => !r.quiz || !r.quiz.question || r.quiz.question.trim() === '');

                const gradedDoneCount = gradedRes.filter(r => isResourceCompleted(stu.username, r.id)).length;
                const refDoneCount = refRes.filter(r => isResourceCompleted(stu.username, r.id)).length;
                const totalGraded = gradedRes.length;
                const percent = totalGraded > 0 ? Math.round((gradedDoneCount / totalGraded) * 100) : 0;

                return `
                  <tr>
                    <td><b>${stu.grade || '-'} (${stu.class || '-'})</b></td>
                    <td>${stu.username}</td>
                    <td>${stu.name || stu.username}</td>
                    <td><span style="color: var(--chalk-green); font-weight: bold;">${gradedDoneCount}</span> / ${totalGraded} 分</td>
                    <td>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div style="width:70px; height:12px; background:rgba(255,255,255,0.1); border-radius:6px; overflow:hidden; border:1px solid #fff;">
                          <div style="width:${percent}%; height:100%; background:var(--chalk-green);"></div>
                        </div>
                        <span style="font-size:0.9rem;">${percent}%</span>
                      </div>
                    </td>
                    <td style="color: var(--chalk-blue);">${refDoneCount} / ${refRes.length} 篇</td>
                    <td>
                      <button class="btn btn-sm btn-yellow" onclick="openStudentDetailModal('${stu.username}')">🔍 查看練習明細</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function filterProgressReportByClass(cls) {
      progressReportClassFilter = cls;
      const view = document.getElementById('view-container');
      if (view) renderProgressReportView(view);
    }

    function exportProgressReportExcel() {
      const studentUsers = users.filter(u => u.role === 'student');
      const rows = [
        ['年級', '班別', '學生帳號', '學生姓名', '選修科目', '應修測驗總數 (滿分)', '已答對題數 (得分)', '測驗得分率 (%)', '參考資料閱讀數']
      ];

      studentUsers.forEach(stu => {
        const assignedRes = resources.filter(r => isStudentEligibleForResource(stu, r));
        const gradedRes = assignedRes.filter(r => r.quiz && r.quiz.question && r.quiz.question.trim() !== '');
        const refRes = assignedRes.filter(r => !r.quiz || !r.quiz.question || r.quiz.question.trim() === '');

        const gradedDoneCount = gradedRes.filter(r => isResourceCompleted(stu.username, r.id)).length;
        const refDoneCount = refRes.filter(r => isResourceCompleted(stu.username, r.id)).length;
        const totalGraded = gradedRes.length;
        const percent = totalGraded > 0 ? Math.round((gradedDoneCount / totalGraded) * 100) : 0;
        const electivesStr = (stu.electives || []).join(', ');

        rows.push([stu.grade || '', stu.class || '', stu.username, stu.name || '', electivesStr, totalGraded, gradedDoneCount, percent, `${refDoneCount}/${refRes.length}`]);
      });

      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "自學成績進度報表");
      XLSX.writeFile(wb, `黑板大冒險_自學進度報表_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (modal) modal.classList.remove('active');
    }
  </script>
